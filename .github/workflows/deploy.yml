name: CI/CD to Oracle Cloud

on:
  push:
    branches:
      - add-deploy-ci-cd
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # עדכון לגרסה העדכנית

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3 # גרסה יציבה ועדכנית
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="~/Lugh-Front"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$TARGET_DIR" ]; then
              git clone $REPO_URL $TARGET_DIR
              cd $TARGET_DIR
            else
              cd $TARGET_DIR
              git fetch origin dev
              # זה מוודא שהקוד בשרת נמחק ומתעדכן למה שיש בגיטהאב עכשיו
              git reset --hard origin/dev
              git clean -fd
            fi

            # בנייה מחדש ללא Cache כדי למנוע זכירת שגיאות
            echo "Building Docker image without cache..."
            docker build --no-cache -t lugh-front-image .

            echo "Restarting container..."
            docker stop lugh-front-container || true
            docker rm lugh-front-container || true
            docker run -d --name lugh-front-container -p 80:3000 lugh-front-image
