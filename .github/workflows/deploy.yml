name: CI/CD to Oracle Cloud

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # שלב חדש: העתקת קובץ הקונפיגורציה של Nginx מהפרויקט לשרת
      - name: Copy Nginx Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/lugh.site.conf"
          target: "~/" # מעתיק לתיקיית הבית בשרת

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1. עצירת הקונטיינר הישן שתופס את פורט 80 (חובה לפני הפעלת Nginx)
            echo "Stopping old container to free port 80..."
            docker stop lugh-front-container || true
            docker rm lugh-front-container || true

            # 2. התקנת Nginx אם הוא לא קיים
            if ! command -v nginx > /dev/null; then
              echo "Nginx not found, installing..."
              sudo apt update
              sudo apt install nginx -y
            fi

            # 3. הגדרת Nginx
            echo "Configuring Nginx..."
            sudo cp ~/nginx/lugh.site.conf /etc/nginx/sites-available/lugh.site
            sudo ln -sf /etc/nginx/sites-available/lugh.site /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default

            # 4. הפעלה מחדש של Nginx (עכשיו כשפורט 80 פנוי)
            sudo nginx -t
            sudo systemctl restart nginx || sudo systemctl start nginx

            # 5. עדכון קוד ובניית Docker (כרגיל)
            TARGET_DIR="~/Lugh-Front"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$TARGET_DIR" ]; then
              git clone $REPO_URL $TARGET_DIR
              cd $TARGET_DIR
            else
              cd $TARGET_DIR
              git fetch origin development
              git reset --hard origin/development
              git clean -fd
            fi

            echo "Building Docker image..."
            docker build --no-cache \
              --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
              --build-arg NEXT_GOOGLE_CLIENT_ID="${{ secrets.NEXT_GOOGLE_CLIENT_ID }}" \
              -t lugh-front-image .

            # 6. הרצת הקונטיינר בפורט 3000 (Nginx יעביר אליו את התנועה מ-80)
            echo "Starting new container on port 3000..."
            docker run -d --name lugh-front-container -p 3000:3000 lugh-front-image
