name: CI/CD to Oracle Cloud

on:
  push:
    branches:
      - add-deploy-ci-cd
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # שלב חדש: העתקת קובץ הקונפיגורציה של Nginx מהפרויקט לשרת
      - name: Copy Nginx Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/lugh.site.conf"
          target: "~/" # מעתיק לתיקיית הבית בשרת

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # --- התקנת Nginx אם הוא לא קיים ---
            if ! command -v nginx > /dev/null; then
              echo "Nginx not found, installing..."
              sudo apt update
              sudo apt install nginx -y
            fi

            # --- טיפול ב-Nginx ---
            echo "Configuring Nginx..."
            # וודא שהתיקייה קיימת (ליתר ביטחון)
            sudo mkdir -p /etc/nginx/sites-available/
            sudo mkdir -p /etc/nginx/sites-enabled/

            # העתקה מהבית לתיקיית הקונפיגורציות של Nginx
            sudo cp ~/nginx/lugh.site.conf /etc/nginx/sites-available/lugh.site

            # יצירת Symlink (קישור)
            sudo ln -sf /etc/nginx/sites-available/lugh.site /etc/nginx/sites-enabled/

            # הסרת ברירת המחדל של Nginx כדי שלא תתנגש
            sudo rm -f /etc/nginx/sites-enabled/default

            # בדיקת תקינות וריסטארט
            sudo nginx -t
            sudo systemctl restart nginx

            # --- טיפול ב-Docker ---
            TARGET_DIR="~/Lugh-Front"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$TARGET_DIR" ]; then
              git clone $REPO_URL $TARGET_DIR
              cd $TARGET_DIR
            else
              cd $TARGET_DIR
              git fetch origin add-deploy-ci-cd
              git reset --hard origin/add-deploy-ci-cd
              git clean -fd
            fi

            echo "Building Docker image without cache..."
            docker build --no-cache \
              --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
              --build-arg NEXT_GOOGLE_CLIENT_ID="${{ secrets.NEXT_GOOGLE_CLIENT_ID }}" \
              -t lugh-front-image .

            echo "Restarting container..."
            docker stop lugh-front-container || true
            docker rm lugh-front-container || true

            # הרצה על פורט 3000 (כי Nginx תופס את 80)
            docker run -d --name lugh-front-container -p 3000:3000 lugh-front-image
