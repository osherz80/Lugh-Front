version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.sandbox  # או Dockerfile.dev לפי השם שבחרת
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - WATCHPACK_POLLING=true
    env_file:
      - .env.local  # במידה ויש קובץ env